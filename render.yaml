services:
  - type: web
    name: pulsepoll-backend
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: backend
    rootDir: backend
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8080"
      - key: APP_ENV
        value: "production"
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
      - key: MONGO_URI
        sync: false
      - key: REDIS_URL
        sync: false
